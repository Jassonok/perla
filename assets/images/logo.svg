<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pearlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C384" />
      <stop offset="50%" stop-color="#9E782F" />
      <stop offset="100%" stop-color="#593F0C" />
    </linearGradient>
    <radialGradient id="pearlShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F7EEDD" />
      <stop offset="75%" stop-color="#DEC9A6" />
      <stop offset="100%" stop-color="#9E782F" />
    </radialGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC9A6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#775A19" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Outer Fine Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#ringGold)" stroke-width="1.2" stroke-dasharray="85 10" />

  <!-- Stylized Elegant Shell / Crown Arc -->
  <path d="M 12 28 C 12 16, 36 16, 36 28 C 34 35, 14 35, 12 28 Z" fill="none" stroke="url(#pearlGold)" stroke-width="1" opacity="0.6"/>

  <!-- Lustrous Pearl Core -->
  <circle cx="24" cy="24" r="10.5" fill="url(#pearlShine)" filter="drop-shadow(0 2px 4px rgba(119,90,25,0.25))" />

  <!-- Pearl Highlight -->
  <ellipse cx="21" cy="20.5" rx="3.5" ry="2" transform="rotate(-30 21 20.5)" fill="#FFFFFF" opacity="0.85" />

  <!-- Tiny Diamond Sparkle at Top -->
  <path d="M 24 5 L 25.5 8 L 24 11 L 22.5 8 Z" fill="url(#pearlGold)" />
</svg>
